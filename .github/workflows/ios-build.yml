name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
    
    - name: Build iOS App
      run: |
        cd ios/SkiPal
        xcodebuild -scheme SkiPal \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          clean build
    
    - name: Run Tests
      run: |
        cd ios/SkiPal
        xcodebuild test \
          -scheme SkiPal \
          -destination 'platform=iOS Simulator,name=iPhone 15'
